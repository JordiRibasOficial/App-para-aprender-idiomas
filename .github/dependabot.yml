version: 2
updates:
  # Keeps third-party Actions current — matters more once they're pinned
  # to a commit SHA (see the workflow files' own comments): a SHA pin
  # doesn't auto-update like a `@v2` tag would, so something has to open
  # the bump PRs instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The 162 Dart/Flutter dependencies audited in
  # docs/business/dependency-license-audit.md had no auto-update PRs at
  # all until now — security fixes (e.g. a CVE in a transitive package)
  # would otherwise only surface by someone manually running
  # `flutter pub outdated`.
  - package-ecosystem: "pub"
    directory: "/src/mobile"
    schedule:
      interval: "weekly"

  # Deno support (>=v2) — each Edge Function has its own deno.json import
  # map (supabase-js, zod), so each needs its own entry.
  - package-ecosystem: "deno"
    directory: "/src/backend/supabase/functions/verify-purchase"
    schedule:
      interval: "weekly"

  - package-ecosystem: "deno"
    directory: "/src/backend/supabase/functions/get-course-content"
    schedule:
      interval: "weekly"
