name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  # Lets a run be triggered directly via the REST API instead of waiting
  # on a push/pull_request webhook — added during a GitHub Actions
  # incident where webhook delivery was throttled to ~15%, so pushed
  # commits weren't reliably starting a run on their own.
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.8'

defaults:
  run:
    working-directory: src/mobile

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/mobile/android/**/*.gradle*', 'src/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build appbundle --release

      - name: Upload release .aab
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: src/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    # Default job timeout is 360 minutes — far too long for something that
    # normally takes ~5 min. Fail fast instead of hanging silently for
    # hours (observed: macOS runners occasionally stall on this step even
    # with no GitHub-wide incident to blame).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # CocoaPods spec resolution + Xcode build products. pubspec.lock is
      # the right cache key here too — it's what changes when a native
      # iOS dependency (e.g. google_mobile_ads) is added or bumped.
      - name: Cache CocoaPods and Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - run: flutter pub get
      # No signing certificates exist yet (Paso 13, requires the Apple
      # Developer account) — this only proves the iOS build compiles.
      - run: flutter build ios --release --no-codesign

  # integration_test/ runs the real app against a real device — real
  # SharedPreferences, real SQLite, real InAppPurchaseSubscriptionRepository
  # (not the mocks test/ uses). Can't run in the dev sandbox (no KVM, no
  # macOS) — this is the actual verification. See integration_test/app_test.dart.
  integration-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration_test on a real (KVM-accelerated) Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd src/mobile && flutter test integration_test/app_test.dart

  integration-test-ios:
    runs-on: macos-latest
    # Bounded by setup plus two 8-minute test attempts below, not by an
    # arbitrary top-level number — see the retry step for why there are two.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Same cache as build-ios — this job also compiles the whole iOS
      # app (to install it on the simulator) before running any tests.
      - name: Cache CocoaPods and Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - run: flutter pub get

      - name: Boot an available iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | .value[] | select(.name | startswith("iPhone")) | .udid
          ' | head -1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner image." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # `flutter test -d <simulator>` has intermittently hung after a
      # successful Xcode build with zero output — confirmed via CI logs: a
      # passing run finishes the whole test in under a minute after "Xcode
      # build done.", but failing runs sit completely silent for 6-17+
      # minutes until the job timeout kills them. That silence means the
      # hang is in installing/launching the app on the Simulator, before
      # any app code (including main()) runs — infra flakiness, not
      # something fixable from the Dart side. Bound the first attempt
      # tightly and retry once instead of burning the whole job timeout
      # waiting on a hang that a retry usually clears.
      - name: Run integration_test on the iOS Simulator
        id: integration_test_ios_attempt1
        continue-on-error: true
        timeout-minutes: 8
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR_UDID"

      - name: Retry integration_test on the iOS Simulator
        if: steps.integration_test_ios_attempt1.outcome == 'failure'
        timeout-minutes: 8
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR_UDID"
