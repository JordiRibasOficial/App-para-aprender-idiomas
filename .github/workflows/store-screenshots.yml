name: Store screenshots

# Manual only — this doesn't need to run on every push, just on demand
# when the UI changes enough to need fresh store-listing screenshots.
# Captures real screenshots at the CI Android emulator's actual device
# resolution (Pixel 6 profile, 1080x2400), via `flutter drive` (required
# for IntegrationTestWidgetsFlutterBinding.takeScreenshot() to work — see
# integration_test/screenshot_test.dart and test_driver/integration_test.dart).
on:
  workflow_dispatch:

# See mobile-ci.yml's permissions block — same rationale: nothing here
# writes to the repo, only checkout + build + upload-artifact.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

defaults:
  run:
    working-directory: src/mobile

jobs:
  screenshots-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('src/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on a real (KVM-accelerated) Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Must be a single shell invocation — this action runs each line
          # of a multi-line `script:` as a *separate* `sh -c` call, so a
          # `cd` on one line doesn't carry over to the next (confirmed by
          # a real CI failure: "No pubspec.yaml file found" from a
          # `flutter drive` that ran outside src/mobile). `>` folds this
          # into one line, matching the working pattern already used by
          # the integration-test-android job above.
          # --profile, not --release: debug builds show Flutter's red
          # "DEBUG" ribbon in the corner of every screen (confirmed
          # present in a real capture), but `flutter drive` for non-web
          # targets flatly refuses --release ("Flutter Driver (non-web)
          # does not support running in release mode" — confirmed by a
          # real CI failure). Profile mode also has no debug banner.
          #
          # Four separate `flutter drive` invocations, not one file with
          # seven testWidgets: 01-04 share a process fine (confirmed good,
          # distinct captures), but 05-07 kept coming back byte-identical
          # to whatever screenshot preceded them in the same process, even
          # split into their own testWidgets — takeScreenshot() leaves the
          # native side in a bad state that a fresh testWidgets doesn't
          # clear, only a fresh process does. Each `&&`-chained command
          # below launches its own app process against the same emulator,
          # so 05/06/07 each start from a genuinely clean install.
          script: >
            cd src/mobile &&
            flutter drive
            --profile
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshot_test.dart
            -d emulator-5554 &&
            flutter drive
            --profile
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshot_05_ejercicio_test.dart
            -d emulator-5554 &&
            flutter drive
            --profile
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshot_06_ejercicio2_test.dart
            -d emulator-5554 &&
            flutter drive
            --profile
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshot_07_premium_test.dart
            -d emulator-5554

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-android
          path: src/mobile/screenshots/
          if-no-files-found: error
