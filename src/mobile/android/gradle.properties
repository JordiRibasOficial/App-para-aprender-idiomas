org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental-cache writer can't compute a relative path when the
# project and the Gradle/Pub caches live on different Windows drive letters
# (e.g. project on D:, caches on C:) — it throws instead of falling back to
# an absolute path. Incremental compilation is a build-speed optimization
# only; disabling it avoids the crash with no effect on the build's output.
kotlin.incremental=false
